[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
    "hatch-fancy-pypi-readme",
]
build-backend = "hatchling.build"

[project]
name = "pyc8y"
dynamic = ["version", "readme"]
authors = [{name="Christoph Souris", email="christoph.souris@anyhere.de"}]
description = "Python microservice and application SDK for the Cumulocity REST API using asyncio."
license = {file = "LICENSE"}
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp",
    "cachetools",
    "certifi",
    "orjson",
]

[project.optional-dependencies]
pydf = ["python-dict-display-filter"]
jmespath = ["jmespath"]
jsonpath = ["jsonpath-ng"]
filters = ["python-dict-display-filter", "jmespath", "jsonpath-ng"]
pandas = ["pandas"]
cryptography = ["cryptography"]

[project.urls]
Homepage = "https://github.com/chisou/cumulocity-python-sdk"
Source = "https://github.com/chisou/cumulocity-python-sdk"
Issues = "https://github.com/chisou/cumulocity-python-sdk/issues"
Documentation = "https://cumulocity-python-sdk.readthedocs.io/en/latest/"

[dependency-groups]
dev = [
    "coolname",
    "cryptography",
    "deepdiff",
    "fastapi",
    "inputimeout",
    "PyJWT",
    "pytest",
    "pytest-asyncio",
    "pytest-benchmark",
    "pytest-cov",
    "python-dotenv",
    "ruff",
    "starlette",
    "tenacity",
    "ujson",
    "uvicorn",
    "werkzeug",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/pyc8y"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '>\s*\[!IMPORTANT\]'
replacement = '> 🚨 **Important**'
