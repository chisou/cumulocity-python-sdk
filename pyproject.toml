[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
]
build-backend = "hatchling.build"

[project]
name = "pyc8y"
dynamic = ["version"]
authors = [{name="Christoph Souris", email="christoph.souris@anyhere.de"}]
description = "Python microservice and application SDK for the Cumulocity REST API using asyncio."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp",
    "cachetools",
    "certifi",
    "orjson",
]

[project.optional-dependencies]
pydf = ["python-dict-display-filter"]
jmespath = ["jmespath"]
jsonpath = ["jsonpath-ng"]
filters = ["python-dict-display-filter", "jmespath", "jsonpath-ng"]
pandas = ["pandas"]

[project.urls]
Homepage = "https://github.com/Cumulocity-IoT/cumulocity-python-api"
Source = "https://github.com/Cumulocity-IoT/cumulocity-python-api"
Issues = "https://github.com/Cumulocity-IoT/cumulocity-python-api/issues"
Documentation = "https://cumulocity-python-api.readthedocs.io/en/latest/"

[dependency-groups]
dev = [
    "coolname",
    "deepdiff",
    "fastapi",
    "inputimeout",
    "PyJWT",
    "pytest",
    "pytest-asyncio",
    "pytest-benchmark",
    "pytest-cov",
    "python-dotenv",
    "ruff",
    "starlette",
    "tenacity",
    "ujson",
    "uvicorn",
    "werkzeug",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/pyc8y"]

[tool.hatch.version]
source = "vcs"
