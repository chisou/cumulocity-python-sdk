site_name: Cumulocity Python SDK Docs
site_url: !ENV READTHEDOCS_CANONICAL_URL

theme:
  name: material
  features:
    - navigation.expand
    - navigation.sections
    - navigation.instant

plugins:
  - search
  - macros
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            filters:
              - "!^_"          # hide underscore-prefixed by default
              - "^__init__$"   # but keep constructors (last match wins)
            show_if_no_docstring: true
            show_source: false
            show_bases: false
            show_signature_annotations: true
            show_root_full_path: true
            extensions:
              - docs/griffe_ext.py:HideAttributes

markdown_extensions:
  - toc:
      toc_depth: 2
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Application Helpers: docs-app.md
  - SDK Clients: docs-base.md
  - Main API classes: docs-main.md
  - Object model classes: docs-model.md
  - Measurement extensions: docs-measurements.md